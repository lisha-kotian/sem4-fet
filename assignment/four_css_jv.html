
<!DOCTYPE html>
<html>
<head>
  <title>change color in Z-index</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }

    .container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: auto;
    }

    .box {
      position: absolute;
      width: 200px;
      height: 200px;
      color: white;
      font-size: 25px;
      line-height: 200px;
      border-radius: 10px;
    }

    .purple {
      background: purple;
      z-index: 1;
    }

    .blue {
      background: blue;
      z-index: 2;
    }

    .red {
      background: red;
      z-index: 3;
    }
    .orange{
    background:orange;
    z-index:4;
    }
    
   

    button {
      margin-top: 20px;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Z-Index Demo</h1>
  <h2>change color</h2>

  <!-- All boxes overlap in one place -->
  <div class="container">
    <div class="box purple" id="purpleBox">purple</div>
    <div class="box blue" id="blueBox">Blue</div>
    <div class="box red" id="redBox">red</div>
    <div class="box orange" id="orangebox">orange</div>
  </div>

  <br>

  <!-- Buttons -->
  <button onclick="showBox('purpleBox')">Show purple</button>
  <button onclick="showBox('blueBox')">Show Blue</button>
  <button onclick="showBox('redBox')">Show red</button>
  <button onclick="showBox('orangeBox')">show orange</button>

  <script>
    let z = 3;

    function showBox(id) {
      z++;
      document.getElementById(id).style.zIndex = z;
    }
  </script>

</body>
</html>
