<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop and Do While Loop Demo</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1{
            color: #333;
            margin-bottom: 20px;
        }

        p{
            color: #666;
            margin-bottom: 25px;
        }

        .btn-group{
            margin-bottom: 20px;
        }

        button{
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        .while-btn{
            background: #007bff;
        }

        .while-btn:hover{
            background: #0056b3;
            transform: scale(1.05);
        }

        .do-btn{
            background: #28a745;
        }

        .do-btn:hover{
            background: #1e7e34;
            transform: scale(1.05);
        }

        #output{
            margin-top: 20px;
            padding: 20px;
            background: #f4f4f4;
            border-radius: 10px;
            min-height: 120px;
            text-align: left;
            font-size: 18px;
            color: #222;
            overflow-y: auto;
        }

        .number{
            padding: 5px;
            margin: 5px 0;
            background: #e3f2fd;
            border-left: 5px solid #2196f3;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>JavaScript Loop Demonstration</h1>

        <p>
            Click the buttons below to display numbers using
            While Loop and Do While Loop.
        </p>

        <div class="btn-group">

            <button class="while-btn" onclick="showWhileLoop()">
                Show While Loop
            </button>

            <button class="do-btn" onclick="showDoWhileLoop()">
                Show Do While Loop
            </button>

        </div>

        <div id="output">
            Output will appear here...
        </div>

    </div>

    <script>

        function showWhileLoop()
        {
            let i = 1;
            let result = "<h3>While Loop Output</h3>";

            while(i <= 10)
            {
                result += "<div class='number'>Number : " + i + "</div>";
                i++;
            }

            document.getElementById("output").innerHTML = result;
        }

        function showDoWhileLoop()
        {
            let i = 1;
            let result = "<h3>Do While Loop Output</h3>";

            do
            {
                result += "<div class='number'>Number : " + i + "</div>";
                i++;
            }
            while(i <= 10);

            document.getElementById("output").innerHTML = result;
        }

    </script>

</body>
</html>
