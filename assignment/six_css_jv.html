<!DOCTYPE html>
<html>
<head>
<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        background: linear-gradient(135deg, #1e1b4b, #431407, #7c2d12);
        color:white;
        margin-top:50px;
        min-height:100vh;
    }
    button{
        padding:10px 20px;
        margin:10px;
        border:none;
        border-radius:5px;
        background:#14b8a6;
        color:white;
        font-weight:bold;
        cursor:pointer;
    }
    button:hover{
        background:white;
        color:black;
    }
    .container{
        position:relative;
        width:300px;
        height:180px;
        margin:auto;
    }
    .layer{
        position:absolute;
        width:100%;
        height:100%;
        border-radius:12px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:24px;
        font-weight:bold;
        transition:0.4s;
    }
    /* Kept your color scheme, just updated IDs for the new topics */
    #projects{
        background:#6366f1;
        z-index:1;
    }
    #design{
        background:#0ea5e9;
        z-index:0;
    }
    #contact{
        background:#0d9488;
        z-index:0;
    }
    .resume-box{
        margin-top:35px;
    }
    .resume-box a{
        display:inline-block;
        padding:10px 18px;
        background:#14b8a6;
        color:white;
        text-decoration:none;
        border-radius:6px;
        font-weight:bold;
    }
</style>
</head>
<body>
<h2>Using Z-index Layers</h2>
<!-- Updated button text and click actions -->
<button onclick="showLayer('projects')">Layer 1</button>
<button onclick="showLayer('design')">Layer 2</button>
<button onclick="showLayer('contact')">Layer 3</button>

<div class="container">
    <!-- Updated div IDs and content text -->
    <div id="projects" class="layer">
        Projects
    </div>
    <div id="design" class="layer">
        Design
    </div>
    <div id="contact" class="layer">
        Contact
    </div>
</div>

<div class="resume-box">
  <a href="https://lisha-kotian.github.io/sem4-fet/">My Resume</a>
        My Resume
    </a>
</div>

<script>
function showLayer(selectedLayer){
    const layers = document.querySelectorAll('.layer');
    layers.forEach(layer=>{
        layer.style.zIndex = "0";
    });
    document.getElementById(selectedLayer).style.zIndex = "10";
}
</script>
</body>
</html>
